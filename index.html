<div class="gst-grid">

    <button
        class="gst-btn"
        onclick="setGST(0,this)">
        0%
    </button>

    <button
        class="gst-btn"
        onclick="setGST(5,this)">
        05%
    </button>

    <button
        class="gst-btn"
        onclick="setGST(12,this)">
        12%
    </button>

    <button
        class="gst-btn active"
        onclick="setGST(18,this)">
        18%
    </button>

    <button
        class="gst-btn"
        onclick="setGST(28,this)">
        28%
    </button>

</div>
